# Publishes DevStarter to the Microsoft Marketplace and to Open VSX.
#
# It can be started in two ways:
#   - By hand: GitHub > Actions > Publish > "Run workflow" (with a dry-run option).
#   - By pushing a version tag:  git tag v1.0.2 && git push origin v1.0.2
#     (! the tag must match the version in package.json).
#
# ! It needs two repository secrets (Settings > Secrets and variables > Actions):
#   VSCE_PAT  Azure DevOps token with the "Marketplace > Manage" scope
#   OVSX_PAT  token from https://open-vsx.org
#
# To publish from your own computer instead, use the "DevStarter: Publish ..." VS Code tasks.
name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo ensayar (comprobar y empaquetar, sin publicar)'
        type: boolean
        default: true
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: La etiqueta coincide con la version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la version $VERSION del package.json"
            exit 1
          fi

      # ! The tests open VS Code: they need a virtual display (xvfb).
      - name: Tests (version reciente y version minima de VS Code)
        run: |
          xvfb-run -a pnpm test
          xvfb-run -a pnpm test:min

      - name: Ensayo
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: node scripts/publish.mjs --dry-run --skip-tests

      - name: Publicar
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: node scripts/publish.mjs --yes --skip-tests
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
