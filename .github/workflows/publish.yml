# Publica DevStarter en el Marketplace de Microsoft y en Open VSX.
#
# Se lanza de dos formas:
#   - A mano: GitHub > Actions > Publish > "Run workflow" (con la opcion de solo ensayar).
#   - Al subir una etiqueta de version:  git tag v1.0.2 && git push origin v1.0.2
#     (la etiqueta tiene que coincidir con la version del package.json).
#
# Hacen falta dos secretos del repositorio (Settings > Secrets and variables > Actions):
#   VSCE_PAT  token de Azure DevOps con permiso "Marketplace > Manage"
#   OVSX_PAT  token de https://open-vsx.org
#
# Si prefieres publicar desde tu ordenador, usa las tareas "DevStarter: Publish ..." de VS Code.
name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo ensayar (comprobar y empaquetar, sin publicar)'
        type: boolean
        default: true
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: La etiqueta coincide con la version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la version $VERSION del package.json"
            exit 1
          fi

      # Los tests abren VS Code: necesitan una pantalla virtual (xvfb).
      - name: Tests (version reciente y version minima de VS Code)
        run: |
          xvfb-run -a pnpm test
          xvfb-run -a pnpm test:min

      - name: Ensayo
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: node scripts/publish.mjs --dry-run --skip-tests

      - name: Publicar
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: node scripts/publish.mjs --yes --skip-tests
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
