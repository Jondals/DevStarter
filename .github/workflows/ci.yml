# DevStarter CI: types, lint, formatting and tests on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm format:check
      # ! The tests open VS Code: on Linux they need a virtual display (xvfb).
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: pnpm test

  # * The same tests on the MINIMUM VS Code version declared in the manifest (engines.vscode),
  # * so the extension is proven to install and work on the oldest derived IDEs too.
  test-minimum-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm test:min
