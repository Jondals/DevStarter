# Every Monday, creates real projects with the latest versions of the project generators
# (create-vite, create-next-app, sv, @nestjs/cli, @angular/cli…). If one of them changes
# and breaks, this workflow fails and GitHub sends an email before users notice.
name: Scaffolders (weekly)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: git config --global user.name "DevStarter CI" && git config --global user.email "ci@example.com"
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke
