# Dependabot opens weekly pull requests to keep the extension's dependencies
# (TypeScript, esbuild, ESLint…) and the GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
