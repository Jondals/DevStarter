# Dependabot abre pull requests cada semana para mantener al día las dependencias
# de la extensión (TypeScript, esbuild, ESLint…) y las acciones de GitHub.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
